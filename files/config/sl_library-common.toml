["SL Library"]
	#Determine how SL Library will handle errors.
	#
	#RESIST: It increases the system's resilience, preventing executions from collapsing when errors occur.
	#
	#ABORT: Close the game immediately if you encounter a fatal error; as a result, you will get debugging. If you are in a development environment, this option will be the preferred one regardless of what you select.
	#Allowed Values: RESIST, ABORT
	SLLibraryExecutionPolicy = "RESIST"
	#If a process fails repeatedly and never experiences an "improvement" or a resolution of the failure,
	#and the problem persists for a certain period of time, the instance will be terminated.
	#
	SLAllowProcessLassoException = false
